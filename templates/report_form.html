
{% extends "base.html" %}

{% block content %}

<h1>Report an Item</h1>
<p>Enter information about your lost or found item.</p>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

{% if errors %}
    {% for message in errors.values() %}
        <p class="error">{{ message }}</p>
    {% endfor %}
{% endif %}

<form method="POST" action="/reports/new">

    <label for="status">Lost or Found</label>
    <select id="status" name="status" required>
        <option value="lost" {% if form.get('status', '') == 'lost' %}selected{% endif %}>Lost</option>
        <option value="found" {% if form.get('status', '') == 'found' %}selected{% endif %}>Found</option>
    </select>

    <label for="item_name">Item Name</label>
    <input type="text" id="item_name" name="item_name"
           value="{{ form.get('item_name', '') }}" required>

    <label for="category">Category</label>
    <input type="text" id="category" name="category"
           value="{{ form.get('category', '') }}" required>

    <label for="date">Date</label>
    <input type="date" id="date" name="date"
           value="{{ form.get('date', '') }}" required>

    <label for="location">Location</label>
    <input type="text" id="location" name="location"
           value="{{ form.get('location', '') }}" required>

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="4"
              required>{{ form.get('description', '') }}</textarea>

    <label for="contact_info">Contact Information</label>
    <input type="text" id="contact_info" name="contact_info"
           value="{{ form.get('contact_info', '') }}" required>

    <button type="submit">Submit Report</button>

</form>

{% endblock %}
