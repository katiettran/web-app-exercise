
{% extends "base.html" %}

{% block content %}

<h1>Delete Report</h1>

<div class="card">
    <p>Are you sure you want to delete <strong>{{ report.item }}</strong>?</p>

    <form method="POST">
        <button type="submit">Yes, Delete</button>
    </form>

    <a href="/reports/{{ report._id }}">Cancel</a>
</div>

{% endblock %}
